name: "👾 Continuous integration"

on:
  # `main` only on push. A branch with an open PR already fires through
  # `pull_request`, and listening to both events ran everything TWICE per push:
  # double the minutes for the same commit.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# `head_ref` on a PR and `ref` on main: that way a new push cancels the previous
# one on the SAME branch, which is what we want, without cancelling another's.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # The job names stay in Spanish: they are the names the `main` branch
    # ruleset lists as required checks, and renaming them here without renaming
    # them there blocks every merge until somebody notices.
    name: Build · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The `engines` floor and the current one. A library breaks by Node
        # version, not by operating system: hence a Node matrix and not an OS
        # one, the opposite of an API with native binaries.
        node: ["22.x", "24.x"]
    steps:
      - name: 📚 Check out the repository
        uses: actions/checkout@v7

      - name: 🟢 Set up the environment
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: 🔒 Verify token purity
        run: pnpm check:tokens

      # The custom property's name IS Tailwind v4's API. `--spacing-md` was
      # swallowing `max-w-md` in all five projects and nothing caught it: the
      # library does not use `max-w-*` internally, so the failure only existed
      # downstream and with no console error at all.
      - name: 🧱 Verify no token stomps Tailwind
        run: pnpm check:namespace

      # release-please silently ignores keys it does not know, so a broken
      # configuration looks correct until the release fails to cut.
      - name: 🏷️ Validate the release-please configuration
        run: pnpm check:release

      # The 0.6.0 rename swept twenty-one user-facing strings into English, and
      # nothing noticed: axe checks that a control HAS an accessible name, not
      # which language it is in. `Pagination` said «Siguiente» on screen and
      # announced «Página next» for a whole version.
      - name: 🗣️ Verify user-facing copy stays in Spanish
        run: pnpm check:copy

      # It cannot fail on the list — the actions land on a Claude Design canvas
      # this repo cannot open. It prints them, which is the whole point: § 22
      # asked for a row in the controls table and nobody re-read § 22 for
      # thirteen entries. It DOES fail on an entry that never asked at all.
      - name: 📐 List the actions still pending on the identity documents
        run: pnpm check:decisions

      - name: 🧮 Check the types
        run: pnpm typecheck

      # `llms.txt` is what an agent reads from a project that installed the
      # library. It is generated from the types: if somebody changes a prop and
      # does not regenerate it, the document lies and nobody notices until the
      # agent writes code with a prop that no longer exists.
      - name: 🤖 Verify the document for agents
        run: pnpm check:llms

      - name: 🏗️ Build
        run: pnpm build

      # Compiling is not enough: what gets published is `dist/`, and a badly
      # declared subpath in `exports` does not fail until somebody imports it.
      - name: 📦 Verify the published surface
        run: node scripts/check-package-exports.mjs

  test:
    # Pinned by the ruleset. See the note on `build`.
    name: Accesibilidad y contraste
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Check out the repository
        uses: actions/checkout@v7

      - name: 🟢 Set up the environment
        uses: ./.github/actions/setup
        with:
          playwright: "true"

      - name: 🎨 Generate the tokens
        run: pnpm build:tokens

      # Compiles Tailwind for real against `theme.css` and checks what each
      # utility resolves to. It is the gap the story suite left: it measures what
      # the library PUBLISHES, not only what the library uses.
      - name: 🧪 Token regression against Tailwind
        run: pnpm test:unit

      # Monta cada story en un Chromium real y le pasa axe. Corre DOS veces,
      # once per mode: a color only fails in one of the two, so passing in dark
      # proves nothing about light.
      - name: 🌑 Suite in dark mode
        run: pnpm test:dark

      - name: ☀️ Suite in light mode
        run: pnpm test:light
