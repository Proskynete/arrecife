name: "📦 Publicar en npm"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Ensayo: empaqueta y verifica, pero no publica"
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    name: Verificar y publicar
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Necesario para la procedencia: es lo que deja a npm firmar el paquete
      # con un enlace verificable a este commit y a este workflow.
      id-token: write

    steps:
      - name: 📚 Clonar el repositorio
        uses: actions/checkout@v6

      - name: 🟢 Preparar el entorno
        uses: ./.github/actions/setup
        with:
          playwright: "true"

      # La versión sale de package.json, no del tag. Si no coinciden, el
      # release apunta a un código que no es el que se publica — y eso no se
      # puede deshacer: npm no permite reutilizar una versión.
      - name: 🔖 Comprobar que el tag y la versión coinciden
        if: github.event_name == 'release'
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          echo "package.json $version · tag $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::El tag ($tag) no coincide con package.json ($version)."
            exit 1
          fi

      - name: 🚫 Rechazar la versión de plantilla
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$version" = "0.0.0" ]; then
            echo "::error::package.json sigue en 0.0.0. Súbelo antes de publicar."
            exit 1
          fi

      - name: 🔦 ESLint
        run: pnpm lint

      - name: 🧮 Tipos
        run: pnpm typecheck

      - name: 🏗️ Compilar
        run: pnpm build

      - name: 📦 Verificar la superficie publicada
        run: node scripts/check-package-exports.mjs

      # La suite completa antes de publicar, no solo en el PR. Entre que el PR
      # pasó y el release se corta pueden haber entrado otros merges.
      - name: 🌑 Suite en modo oscuro
        run: pnpm test:oscuro

      - name: ☀️ Suite en modo claro
        run: pnpm test:claro

      # `pnpm pack` respeta `files`, así que esto muestra exactamente lo que va
      # a viajar. Es el último punto donde se puede ver un archivo de más.
      - name: 👀 Listar el contenido del tarball
        run: |
          pnpm pack --pack-destination /tmp >/dev/null
          tarball="$(ls /tmp/*.tgz)"
          echo "### Contenido de $(basename "$tarball")" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tar -tzf "$tarball" | sed 's|^package/||' | sort >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "peso: $(du -h "$tarball" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      # pnpm no lee `NODE_AUTH_TOKEN` como lo hace npm, así que el token se
      # escribe explícito en el .npmrc del runner. Es efímero y no toca el
      # .npmrc del repo, que solo lleva `engine-strict`.
      #
      # Va aquí y no al principio a propósito: un ensayo no necesita token, y
      # hacerlo fallar por un secreto que falta rompería justo el modo que
      # existe para probar sin riesgo.
      - name: 🔑 Autenticar contra npm
        if: github.event_name == 'release' || inputs.dry-run == false
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Falta el secreto NPM_TOKEN en el entorno «npm»."
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "$HOME/.npmrc"

      # `--provenance` firma el paquete con un enlace verificable a este commit
      # y a este workflow: quien lo instale puede comprobar de dónde salió.
      # `--no-git-checks` porque el tag ya se validó arriba, contra
      # package.json, que es la comprobación que de verdad importa.
      - name: 🚀 Publicar
        if: github.event_name == 'release' || inputs.dry-run == false
        run: pnpm publish --access public --provenance --no-git-checks

      - name: 🧪 Ensayo, sin publicar
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run == true
        run: |
          echo "Ensayo: se verificó todo y NO se publicó." >> "$GITHUB_STEP_SUMMARY"
          pnpm publish --access public --no-git-checks --dry-run
