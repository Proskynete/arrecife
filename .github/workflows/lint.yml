name: "🔦 Lint"

on:
  # Solo `main` en push. Una rama con PR abierto ya dispara por `pull_request`,
  # y escuchar los dos eventos hacía correr todo DOS veces por cada empujón:
  # el doble de minutos para el mismo commit.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Clonar el repositorio
        uses: actions/checkout@v7

      - name: 🟢 Preparar el entorno
        uses: ./.github/actions/setup

      # Incluye el veto a hex literales fuera de tokens.ts, que es la regla
      # que sostiene toda la librería.
      - name: 🔦 Ejecutar ESLint
        run: pnpm lint
