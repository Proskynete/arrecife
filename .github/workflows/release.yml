name: "🏷️ Release and publish"

# One file on purpose. npm's trusted publishing matches the OIDC token against
# ONE workflow name, and with a reusable workflow there are two candidates — the
# caller and the callee — with no obvious way to know which one npm asks for.
# With one file, the configuration on npmjs is unambiguous: release.yml.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run: verify and pack, but do not publish"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # release-please reads the conventional commits since the last tag and keeps a
  # PR open with the version bump and the CHANGELOG. While that PR stays open it
  # updates itself on every merge to main; when it is merged, it cuts the tag and
  # creates the release.
  #
  # Nobody decides the version by hand: it is decided by the `feat:` and `fix:`
  # commits that already get written, and that `lint-pr-title` already forces to
  # be written correctly.
  prepare:
    name: Prepare the version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The three the action's README asks for. `issues: write` was missing: it is
    # what it needs to maintain its labels (`autorelease: pending`,
    # `autorelease: tagged`), which are how it knows which release PR is still
    # uncut.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      publish: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: 🏷️ release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Verify and publish
    needs: prepare
    # Runs when release-please has just cut a version, or by hand for the dry
    # run. In a dry run `prepare` does not run, so the «skipped» status has to be
    # let through without letting «failure» through.
    if: >-
      ${{ !cancelled()
        && needs.prepare.result != 'failure'
        && (github.event_name == 'workflow_dispatch'
            || needs.prepare.outputs.publish == 'true') }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # What makes trusted publishing possible: GitHub issues an OIDC token
      # proving «this build came out of this repo and this workflow», and npm
      # exchanges it for permission to publish. Without this there is neither
      # OIDC nor provenance.
      id-token: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
      TAG: ${{ needs.prepare.outputs.tag }}
      # At job level because the `secrets` context does not exist inside an
      # `if:`. It is the standard workaround for asking «is it set?».
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: 📚 Clonar el repositorio
        uses: actions/checkout@v7

      - name: 🟢 Preparar el entorno
        uses: ./.github/actions/setup
        with:
          playwright: "true"

      # Trusted publishing needs npm 11.5.1 or later, which is where the OIDC
      # exchange landed. Node 22 ships npm 10, so whatever version the runner
      # brings is not enough.
      - name: ⬆️ Update npm
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version)"

      # The version comes from package.json, not from the tag. If they do not
      # match, the release points at code that is not what gets published — and
      # that cannot be undone: npm does not allow reusing a version.
      - name: 🔖 Check that the tag and the version match
        if: env.TAG != ''
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${TAG#v}"
          echo "package.json $version · tag $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::The tag ($tag) does not match package.json ($version)."
            exit 1
          fi

      - name: 🚫 Reject the template version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$version" = "0.0.0" ]; then
            echo "::error::package.json is still on 0.0.0. Bump it before publishing."
            exit 1
          fi

      - name: 🔦 ESLint
        run: pnpm lint

      - name: 🧮 Types
        run: pnpm typecheck

      - name: 🏗️ Build
        run: pnpm build

      - name: 📦 Verify the published surface
        run: pnpm check:exports

      # The full suite before publishing, not only on the PR. Other merges may
      # have landed between the PR passing and the version being cut.
      - name: 🧪 Token regression against Tailwind
        run: pnpm test:unit

      - name: 🌑 Suite in dark mode
        run: pnpm test:dark

      - name: ☀️ Suite in light mode
        run: pnpm test:light

      # `npm pack` respects `files`, so this shows exactly what is going to
      # travel. It is the last point where an extra file can be spotted.
      - name: 👀 List the tarball contents
        run: |
          npm pack --pack-destination /tmp --ignore-scripts >/dev/null
          tarball="$(ls /tmp/*.tgz)"
          {
            echo "### Contents of $(basename "$tarball")"
            echo '```'
            tar -tzf "$tarball" | sed 's|^package/||' | sort
            echo '```'
            echo "size: $(du -h "$tarball" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      # An intermediate step, and a temporary one. Trusted publishing cannot be
      # configured on a package that does not exist yet, so the FIRST version
      # needs a token. Once it is configured on npmjs, the secret gets deleted
      # and this step skips itself: OIDC takes over with nothing to touch.
      - name: 🔑 npm token, if it is still needed
        if: env.DRY_RUN != 'true' && env.NPM_TOKEN != ''
        run: |
          echo "::warning::Publishing with a token. Configure trusted publishing and delete the NPM_TOKEN secret."
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "$HOME/.npmrc"

      # It publishes with npm's CLI and not with `pnpm publish` on purpose: the
      # OIDC exchange is implemented by npm. The package does not use the
      # `workspace:` protocol, so npm packs exactly the same thing.
      #
      # `--provenance` signs the package with a verifiable link to this commit
      # and this workflow. With trusted publishing it comes out on its own, but
      # leaving it explicit makes it come out during the token step too.
      - name: 🚀 Publish
        if: env.DRY_RUN != 'true'
        run: npm publish --access public --provenance

      # `--dry-run` queries the registry, so it collides with the one thing that
      # in a dry run CANNOT be right: the version. `package.json` points at the
      # one already published except in the window between release-please bumping
      # the number and the workflow publishing — that is, almost never. Without
      # this workaround the dry run is permanently red over the one thing it does
      # not prove, and it takes the jobs depending on it down with it.
      #
      # Every other failure still fails: only that message is forgiven.
      - name: 🧪 Dry run, without publishing
        if: env.DRY_RUN == 'true'
        run: |
          status=0
          output="$(npm publish --access public --dry-run 2>&1)" || status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            if echo "$output" | grep -q 'cannot publish over'; then
              echo "::notice::The version is already published; in a dry run that is expected."
            else
              exit "$status"
            fi
          fi
          echo "Dry run: everything was verified and NOTHING was published." >> "$GITHUB_STEP_SUMMARY"

  # Storybook is the library's published documentation: every story is both the
  # example and the test that verifies it. That is why it is deployed here and
  # not in `ci.yml` — the site and the package have to tell the SAME version. A
  # Storybook ahead of npm shows components nobody can install.
  #
  # Hence also that the Vercel project is NOT connected to GitHub: with the Git
  # integration, Vercel builds on its own on every push to main and there is no
  # way for it to wait for the tag. The only thing that deploys is this job.
  deploy:
    name: Publish Storybook
    needs: publish
    # `publish` already filters on «there is a release»: if no version was cut,
    # nothing reaches here. The dry run DOES pass through, on purpose: a dry run
    # that skips this job cannot tell you whether the job works, and it was the
    # only step in the workflow that could not be tested without spending a
    # version. What changes in a dry run is the destination — a preview, not
    # production — not whether it runs.
    #
    # The `!cancelled()` is the same trap that already surrounds `publish`, one
    # box below: in a dry run `prepare` is skipped, and a «skipped» propagates
    # through the WHOLE downstream graph, not just to the job that needs it
    # directly. Without this, `publish` passed green and this job skipped anyway.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
      # The two ids are NOT secrets: they come out of `.vercel/project.json` in
      # any clone that runs `vercel link`. They go in as repo variables so they
      # are readable in the log when something does not add up. The token IS a
      # secret.
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: 📚 Clonar el repositorio
        uses: actions/checkout@v7

      # No Chromium: the suite does not run here. It already ran in full in `publish`.
      - name: 🟢 Preparar el entorno
        uses: ./.github/actions/setup

      # Missing credentials warn, they do not break. By the time this job runs,
      # npm HAS published and the tag HAS been cut: a red here would read as «the
      # release failed», which is the exact opposite of what happened. The
      # warning stays in the run summary until the secrets are in place.
      - name: 🔑 Check the Vercel credentials
        id: credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::No VERCEL_TOKEN or VERCEL_PROJECT_ID: Storybook is not deployed."
            echo "⚠️ Storybook NOT deployed: the Vercel credentials are missing." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📖 Build Storybook
        if: steps.credentials.outputs.ready == 'true'
        run: pnpm build-storybook

      # It is uploaded already built. With the Build Output API and `--prebuilt`,
      # Vercel executes nothing: it serves what is in `.vercel/output/static` as
      # is. That way Storybook is built by the same Node and the same lockfile
      # that just verified the library, and not by Vercel's framework detection.
      - name: 📦 Pack with the Build Output API
        if: steps.credentials.outputs.ready == 'true'
        run: |
          mkdir -p .vercel/output/static
          cp -R storybook-static/. .vercel/output/static/
          echo '{"version":3}' > .vercel/output/config.json

      # The CLI is pinned to a major: `latest` in a CI `npx` is a dependency with
      # no lockfile that can change between two releases.
      #
      # The two URLs in the summary are not the same thing, and it is worth
      # knowing before assuming something broke: the deployment one is unique to
      # this run and sits behind the team's SSO — Vercel's protection is
      # `all_except_custom_domains` — so opening it from outside returns a 302 to
      # the login. The public one is the custom domain.
      - name: 🚀 Deploy
        if: steps.credentials.outputs.ready == 'true'
        run: |
          version="$(node -p "require('./package.json').version")"
          # Without `--prod` the deployment is a preview: the whole same path,
          # with the same credentials and the same tarball, without touching the
          # public domain. It is what makes the dry run verifiable.
          target=""
          [ "$DRY_RUN" != "true" ] && target="--prod"
          url="$(npx --yes vercel@59 deploy --prebuilt $target --yes --token "$VERCEL_TOKEN")"
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "### Storybook dry run $version"
              echo "- preview: $url"
              echo "- the public domain was NOT touched."
            else
              echo "### Storybook $version"
              echo "- this deployment (asks for a team session): $url"
              echo "- public: https://arrecife.eduardoalvarez.dev"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
