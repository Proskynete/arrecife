name: "📝 PR title"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  lint-pr-title:
    # Pinned by the `main` branch ruleset as a required check.
    name: Formato de commit convencional
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Validate the title
        id: lint_pr_title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The library's real scopes. The list is short on purpose:
          # si hace falta uno nuevo, se piensa antes de escribirlo.
          #
          # `deps` and `deps-dev` are the TWO dependabot generates: the first for
          # production dependencies and the second for development ones, per
          # dependabot.yml's `prefix-development`. The second was missing and
          # tumbaba todos sus PRs de devDependencies.
          #
          # `theme`, `form` and `chart` joined in 0.4.0 by the same criterion as
          # `og` and `shiki`: a published subpath in `exports` is a scope. It is
          # not that the list is opening up, it is that there are three more areas.
          scopes: |
            tokens
            primitives
            components
            brand
            theme
            og
            shiki
            form
            chart
            storybook
            a11y
            deps
            deps-dev
            ci
          requireScope: false
          # Automated PRs are not validated: their titles are generated by their
          # tools and written by nobody, so a hand-curated list of scopes
          # curada a mano solo puede bloquearlos.
          #
          # It happened twice already: dependabot uses the `deps-dev` scope and
          # release-please titles `chore(main): release X.Y.Z`, with the BRANCH as
          # the scope. Neither was ever going to be on the list.
          #
          # They are ignored by LABEL, which is the only thing the bot controls and
          # a human cannot accidentally fake in the title.
          ignoreLabels: |
            bot
            📦 Dependencies
            autorelease: pending

      - name: 💬 Explain the failure
        if: failure()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-title-lint-error
          message: |
            ## ❌ The PR title does not match the format

            Follow [Conventional Commits](https://www.conventionalcommits.org/):
            `type(scope): description`, lowercase and with no trailing period.
            In English, like the rest of the repo.

            **Examples from this repo**:
            - `fix(badge): separate category, status and metric`
            - `feat(og): the four templates with the document's grid`
            - `docs(readme): the third contrast correction`

            **Types**: `feat`, `fix`, `docs`, `style`, `refactor`, `test`,
            `chore`, `perf`, `ci`

            **Detail**: ${{ steps.lint_pr_title.outputs.error_message }}

      - name: ✅ Delete the comment
        if: success()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-title-lint-error
          delete: true
