version: 2
# Twice a year: a weekly schedule kept a queue of open PRs that nobody was
# reviewing. Security updates are not affected by this and still arrive as soon
# as an advisory is published.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: semiannually
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    versioning-strategy: increase
    labels:
      - "📦 Dependencies"
    open-pull-requests-limit: 10
    groups:
      # Radix is sixteen packages that go up together. In separate PRs it is
      # noise; grouped it is a single review.
      radix:
        patterns:
          - "@radix-ui/*"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
          - "storybook-addon-*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "playwright"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "eslint-plugin-*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: semiannually
    labels:
      - "📦 Dependencies"
      - "🚀 CI/CD"
    open-pull-requests-limit: 5
