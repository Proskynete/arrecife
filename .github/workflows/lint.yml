name: "🔦 Lint"

on:
  # `main` only on push. A branch with an open PR already fires through
  # `pull_request`, and listening to both events ran everything TWICE per push:
  # double the minutes for the same commit.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Check out the repository
        uses: actions/checkout@v7

      - name: 🟢 Set up the environment
        uses: ./.github/actions/setup

      # Includes the ban on literal hexes outside tokens.ts, which is the rule
      # the whole library rests on.
      - name: 🔦 Run ESLint
        run: pnpm lint
