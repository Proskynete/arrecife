name: "Set up the environment"
description: "pnpm, Node and the dependencies, cached. Chromium optionally."
author: "Proskynete"

inputs:
  node-version:
    description: "Node version. Defaults to the one `engines` in package.json requires."
    required: false
    default: ""
  playwright:
    description: "Installs Chromium. Only the jobs running the suite need it."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # `packageManager` in package.json pins the pnpm version, so it is not
    # repeated here: if it goes up in the repo, it goes up in CI untouched.
    - name: 📦 Set up pnpm
      uses: pnpm/action-setup@v4

    # With no explicit `node-version` it reads `engines.node` from package.json,
    # which is the library.s real floor. The matrix overrides it to test above
    # that floor.
    - name: 🟢 Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && 'package.json' || '' }}
        cache: pnpm

    - name: 🛠 Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # The Chromium binary is heavy and changes rarely: caching it saves ~40s per
    # job and avoids depending on Playwright.s CDN on every push.
    - name: 🗂 Restore the Chromium cache
      if: inputs.playwright == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: 🎭 Install Chromium
      if: inputs.playwright == 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    - name: 📋 Versions
      shell: bash
      run: echo "node $(node --version) · pnpm $(pnpm --version)"
