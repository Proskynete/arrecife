name: "🛡️ Revisión de dependencias"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Escaneo de seguridad
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Clonar el repositorio
        uses: actions/checkout@v7

      # Una librería publicada arrastra sus dependencias a los cinco proyectos,
      # así que una vulnerabilidad aquí se multiplica por cinco.
      - name: 🔍 Revisar las dependencias
        uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: always
          fail-on-severity: high
