name: "👾 Integración continua"

on:
  # Solo `main` en push. Una rama con PR abierto ya dispara por `pull_request`,
  # y escuchar los dos eventos hacía correr todo DOS veces por cada empujón:
  # el doble de minutos para el mismo commit.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# `head_ref` en un PR y `ref` en main: así un empujón nuevo cancela el anterior
# de la MISMA rama, que es lo que se quiere, sin cancelar el de otra.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # El suelo de `engines` y el actual. Una librería se rompe por versión
        # de Node, no por sistema operativo: por eso hay matriz de Node y no de
        # SO, al revés que en una API con binarios nativos.
        node: ["22.x", "24.x"]
    steps:
      - name: 📚 Clonar el repositorio
        uses: actions/checkout@v7

      - name: 🟢 Preparar el entorno
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: 🔒 Verificar la pureza de los tokens
        run: pnpm check:tokens

      # El nombre de la custom property ES la API de Tailwind v4. `--spacing-md`
      # se comía `max-w-md` en los cinco proyectos y no lo detectó nada: la
      # librería no usa `max-w-*` por dentro, así que el fallo solo existía
      # aguas abajo y sin un solo error en consola.
      - name: 🧱 Verificar que ningún token pisa a Tailwind
        run: pnpm check:namespace

      # release-please ignora en silencio las claves que no conoce, así que una
      # configuración rota parece correcta hasta que el release no se corta.
      - name: 🏷️ Validar la configuración de release-please
        run: pnpm check:release

      - name: 🧮 Comprobar los tipos
        run: pnpm typecheck

      # `llms.txt` es lo que lee un agente desde un proyecto que instaló la
      # librería. Se genera de los tipos: si alguien cambia un prop y no lo
      # regenera, el documento miente y nadie lo nota hasta que el agente
      # escribe código con una prop que ya no existe.
      - name: 🤖 Verificar el documento para agentes
        run: pnpm check:llms

      - name: 🏗️ Compilar
        run: pnpm build

      # Que compile no basta: lo que se publica es `dist/`, y una subruta mal
      # declarada en `exports` no falla hasta que alguien la importa.
      - name: 📦 Verificar la superficie publicada
        run: node scripts/check-package-exports.mjs

  test:
    name: Accesibilidad y contraste
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Clonar el repositorio
        uses: actions/checkout@v7

      - name: 🟢 Preparar el entorno
        uses: ./.github/actions/setup
        with:
          playwright: "true"

      - name: 🎨 Generar los tokens
        run: pnpm build:tokens

      # Compila Tailwind de verdad contra `theme.css` y comprueba a qué resuelve
      # cada utilidad. Es el hueco que dejaba la suite de stories: mide lo que
      # la librería PUBLICA, no solo lo que la librería usa.
      - name: 🧪 Regresión de tokens contra Tailwind
        run: pnpm test:unidad

      # Monta cada story en un Chromium real y le pasa axe. Corre DOS veces,
      # una por modo: un color solo falla en uno de los dos, así que pasar en
      # oscuro no prueba nada sobre el claro.
      - name: 🌑 Suite en modo oscuro
        run: pnpm test:oscuro

      - name: ☀️ Suite en modo claro
        run: pnpm test:claro
