name: "🛡️ Dependency review"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    # Pinned by the `main` branch ruleset as a required check.
    name: Escaneo de seguridad
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Check out the repository
        uses: actions/checkout@v7

      # A published library drags its dependencies into all five projects, so a
      # vulnerability here is multiplied by five.
      - name: 🔍 Revisar las dependencias
        uses: actions/dependency-review-action@v5
        with:
          comment-summary-in-pr: always
          fail-on-severity: high
